<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – DA LOCAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6e6e7c 0%, #16213e 40%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px;
            background: #e94560;
            top: -150px; right: -150px;
        }
        body::after {
            width: 400px; height: 400px;
            background: #0f3460;
            bottom: -100px; left: -100px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            position: relative;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            position: absolute;
            top: 18px; left: 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(255,255,255,0.18); }

        .icon-wrap {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #e94560, #c2185b);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(233,69,96,0.4);
        }
        .icon-wrap svg {
            width: 34px; height: 34px;
            fill: none; stroke: #fff;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        h2 {
            text-align: center;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.55);
            font-size: 0.875rem;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input[type="email"] {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            outline: none;
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        input[type="email"]::placeholder { color: rgba(255,255,255,0.3); }
        input[type="email"]:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.2);
            background: rgba(255,255,255,0.1);
        }

        .btn-reset {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #e94560, #c2185b);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(233,69,96,0.35);
            letter-spacing: 0.3px;
        }
        .btn-reset:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(233,69,96,0.5); }
        .btn-reset:active { transform: translateY(0); }
        .btn-reset:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .success-box {
            display: none;
            text-align: center;
            animation: fadeUp 0.4s ease both;
        }
        .success-box.show { display: block; }
        .form-area.hide { display: none; }

        .success-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #00c853, #009624);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(0,200,83,0.4);
        }
        .success-icon svg {
            width: 32px; height: 32px;
            fill: none; stroke: #fff;
            stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
        }
        .success-title {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .success-msg {
            color: rgba(255,255,255,0.55);
            font-size: 0.875rem;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .success-msg span { color: #e94560; font-weight: 500; }

        .btn-back-login {
            display: inline-block;
            padding: 12px 32px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s;
        }
        .btn-back-login:hover { background: rgba(255,255,255,0.18); }

        .msg-box {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .msg-box.error { display: block; background: rgba(233,69,96,0.15); border: 1px solid rgba(233,69,96,0.3); color: #ff6b8a; }
        .msg-box.info  { display: block; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }

        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .divider {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
        }
        .divider a { color: rgba(255,255,255,0.7); text-decoration: none; font-weight: 500; }
        .divider a:hover { color: #e94560; }
    </style>
</head>
<body>

<div class="card">
    <a class="back-btn" href="javascript:history.back()" title="Go back">✕</a>

    <!-- FORM STATE: only asks for email, no OTP/code needed -->
    <div class="form-area" id="formArea">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1" fill="#fff" stroke="none"/></svg>
        </div>

        <h2>Forgot Password?</h2>
        <p class="subtitle">Enter your registered email address and we'll send you a link to reset your password.</p>

        <div class="msg-box" id="msgBox"></div>

        <label for="resetEmail">Email Address</label>
        <input type="email" id="resetEmail" placeholder="yourname@email.com" autocomplete="off">

        <button class="btn-reset" id="resetBtn">Send Reset Link</button>

        <div class="divider">
            Remember your password? <a href="javascript:history.back()">Go back</a>
        </div>
    </div>

    <!-- SUCCESS STATE -->
    <div class="success-box" id="successBox">
        <div class="success-icon">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="success-title">Email Sent!</div>
        <div class="success-msg">
            A password reset link has been sent to<br>
            <span id="sentToEmail"></span><br><br>
            Check your inbox (and spam folder), then click the link to reset your password. No code needed.
        </div>
        <button class="btn-back-login" id="backLoginBtn">Back to Login</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
    apiKey:            "AIzaSyBaDezXv4aynvYTJaaZyXwIRIImLBEYwB0",
    authDomain:        "dalocal-8ceb3.firebaseapp.com",
    projectId:         "dalocal-8ceb3",
    storageBucket:     "dalocal-8ceb3.appspot.com",
    messagingSenderId: "737186112999",
    appId:             "1:737186112999:web:f61d20523f4ac479f8c942"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

const msgBox     = document.getElementById("msgBox");
const emailInput = document.getElementById("resetEmail");
const resetBtn   = document.getElementById("resetBtn");
const formArea   = document.getElementById("formArea");
const successBox = document.getElementById("successBox");

function showMsg(text, type = "error") {
    msgBox.textContent = text;
    msgBox.className = "msg-box " + type;
}
function hideMsg() {
    msgBox.className = "msg-box";
    msgBox.textContent = "";
}

async function sendReset() {
    const email = emailInput.value.trim();

    if (!email) { showMsg("Please enter your email address."); return; }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) { showMsg("Please enter a valid email address."); return; }

    hideMsg();
    resetBtn.disabled = true;
    resetBtn.innerHTML = '<span class="spinner"></span>Sending...';

    try {
        // Sends a direct reset link, no code/OTP verification step
        await sendPasswordResetEmail(auth, email);

        document.getElementById("sentToEmail").textContent = email;
        formArea.classList.add("hide");
        successBox.classList.add("show");

    } catch (err) {
        resetBtn.disabled = false;
        resetBtn.innerHTML = "Send Reset Link";

        // Firebase intentionally doesn't reveal whether the email exists (security best practice).
        // For most error cases we still show a generic success-style message so we don't leak
        // account existence, EXCEPT for real input problems.
        if (err.code === "auth/invalid-email") {
            showMsg("Please enter a valid email address.");
        } else if (err.code === "auth/too-many-requests") {
            showMsg("Too many attempts. Please wait a few minutes before trying again.", "info");
        } else if (err.code === "auth/user-not-found") {
            // Treat as success to avoid leaking which emails are registered
            document.getElementById("sentToEmail").textContent = email;
            formArea.classList.add("hide");
            successBox.classList.add("show");
        } else {
            showMsg("Something went wrong: " + err.message);
        }
    }
}

resetBtn.addEventListener("click", sendReset);
emailInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendReset();
});

const params = new URLSearchParams(window.location.search);
const loginPage = params.get("from") || "index.html";

document.getElementById("backLoginBtn").addEventListener("click", () => {
    window.location.href = loginPage;
});
</script>
</body>
</html>
