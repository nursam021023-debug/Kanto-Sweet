<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelled & Rejected Orders</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            color: #2d2d2d;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin: 16px 20px 0;
            background: none; border: none;
            color: #5a7fc1; font-size: 14px; font-weight: 600;
            cursor: pointer; padding: 6px 10px; border-radius: 8px;
            transition: background .15s;
        }
        .back-btn:hover { background: #e8eef8; }

        .page-header { padding: 10px 24px 0; }
        .page-title { font-size: 22px; font-weight: 700; color: #1a1a2e; }
        .page-sub { font-size: 13px; color: #777; margin-top: 2px; }

        /* ── Filter tabs (All / Cancelled / Rejected) ──────────────────── */
        .filter-tabs {
            display: flex; gap: 7px; flex-wrap: wrap;
            padding: 14px 20px 0;
        }
        .tab {
            padding: 6px 14px; border-radius: 20px;
            border: 1.5px solid #d0d7e8; background: #fff;
            font-size: 12px; font-weight: 600; color: #5a6a8a;
            cursor: pointer; transition: all .15s; white-space: nowrap;
        }
        .tab.active, .tab:hover {
            background: #1a1a2e; color: #fff; border-color: #1a1a2e;
        }

        .order-list { padding: 14px 20px; display: flex; flex-direction: column; gap: 14px; }

        .empty {
            color: #aaa; text-align: center;
            padding: 60px 0; font-size: 15px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .empty-icon { font-size: 40px; }

        .order-card {
            background: #fff; border-radius: 14px;
            border: 1px solid #e4e9f4;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            overflow: hidden;
            animation: fadeUp .25s ease both;
        }
        .order-card.is-cancelled { border-left: 4px solid #e74c3c; }
        .order-card.is-rejected  { border-left: 4px solid #9b30d0; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .order-card-top {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px 8px; border-bottom: 1px solid #f0f2f8;
        }
        .order-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

        .order-type-badge {
            font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
        }
        .order-badge   { background: #e8f0fe; color: #3a5fcf; }
        .reserve-badge { background: #fff3e0; color: #b05e00; }

        .status-badge {
            font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
        }
        .status-badge.cancelled { background: #fde8e8; color: #8b0000; }
        .status-badge.rejected  { background: #f5e0ff; color: #5c007a; }

        .order-date { font-size: 11px; color: #aaa; white-space: nowrap; }

        .order-body {
            display: flex; gap: 12px; padding: 12px 16px 10px;
        }
        .order-img {
            width: 70px; height: 70px; object-fit: cover;
            border-radius: 10px; border: 1px solid #eee; flex-shrink: 0;
            background: #f4f4f4;
        }
        .order-info { flex: 1; min-width: 0; }
        .order-name { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .order-detail { font-size: 12px; color: #666; margin-top: 2px; }
        .order-price { color: #2a7d4f; }
        .order-seller {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 12px; color: #888; margin-top: 4px;
        }

        /* ── Cancelled notice banner ─────────────────────────────────── */
        .cancelled-notice {
            margin: 0 16px 12px;
            padding: 12px 14px;
            background: #fff0f0;
            border: 1px solid #f5a0a0;
            border-radius: 10px;
            font-size: 12px;
            color: #8b0000;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .cancelled-notice .cn-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .cancelled-notice strong { display: block; font-size: 13px; margin-bottom: 3px; }
        .cancelled-notice p { line-height: 1.5; }

        /* ── Rejected notice banner ──────────────────────────────────── */
        .rejected-notice {
            margin: 0 16px 12px;
            padding: 12px 14px;
            background: #f8eeff;
            border: 1px solid #d9a0f5;
            border-radius: 10px;
            font-size: 12px;
            color: #5c007a;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .rejected-notice .rn-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
        .rejected-notice strong { display: block; font-size: 13px; margin-bottom: 3px; color: #4a0066; }
        .rejected-notice p { line-height: 1.5; }

        /* ── DELETE BUTTON ────────────────────────────────────────────── */
        .delete-btn {
            background: #fff0f0;
            color: #c0392b;
            border: 1.5px solid #f5c6c6;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s, transform .1s, box-shadow .15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .delete-btn:hover {
            background: #fddede;
            box-shadow: 0 2px 8px rgba(192,57,43,.15);
            transform: scale(1.03);
        }
        .delete-btn:active { transform: scale(0.97); }

        /* ── DELETE CONFIRM MODAL ─────────────────────────────────────── */
        .del-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 998;
            align-items: flex-end; justify-content: center;
        }
        .del-modal-overlay.open { display: flex; }
        .del-modal-box {
            background: #fff; border-radius: 20px 20px 0 0;
            padding: 24px 24px 36px; width: 100%; max-width: 480px;
            animation: slideUp .25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        .del-modal-handle {
            width: 40px; height: 4px; border-radius: 3px;
            background: #e0e0e0; margin: 0 auto 18px;
        }
        .del-modal-title { font-size: 17px; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; }
        .del-modal-sub   { font-size: 13px; color: #777; margin-bottom: 20px; line-height: 1.5; }
        .del-modal-btns  { display: flex; gap: 10px; }
        .del-modal-cancel {
            flex: 1; padding: 12px; border-radius: 12px;
            border: 1.5px solid #dde3ef; background: #f4f6f9;
            font-size: 14px; font-weight: 700; color: #5a6a8a; cursor: pointer;
        }
        .del-modal-confirm {
            flex: 2; padding: 12px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: #fff; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: opacity .15s;
        }
        .del-modal-confirm:hover { opacity: .88; }
        .del-modal-confirm:disabled { opacity: .5; cursor: not-allowed; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(60px);
            background: #1a1a2e; color: #fff; padding: 11px 24px;
            border-radius: 30px; font-size: 13px; font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,.2);
            transition: transform .3s ease, opacity .3s ease; opacity: 0; z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <button class="back-btn" onclick="goBack()">&#8592; Back</button>

    <div class="page-header">
        <h1 class="page-title">🚫 Cancelled &amp; Rejected Orders</h1>
        <p class="page-sub" id="customerLabel">—</p>
    </div>

    <div class="filter-tabs" id="filterTabs">
        <button class="tab active" onclick="setFilter('all', this)">All</button>
        <button class="tab" onclick="setFilter('cancelled', this)">Cancelled</button>
        <button class="tab" onclick="setFilter('rejected', this)">Rejected</button>
    </div>

    <div class="order-list" id="orderList"></div>

    <!-- Delete Confirm Modal -->
    <div class="del-modal-overlay" id="delModalOverlay">
        <div class="del-modal-box">
            <div class="del-modal-handle"></div>
            <div class="del-modal-title" id="delModalTitle">🗑️ Delete Order?</div>
            <div class="del-modal-sub">
                This will permanently remove this order from your records.
                This action <strong>cannot be undone</strong>.
            </div>
            <div class="del-modal-btns">
                <button class="del-modal-cancel" id="delModalCancelBtn">Cancel</button>
                <button class="del-modal-confirm" id="delModalConfirmBtn">🗑️ Yes, Delete</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

<script type="module">
    import { getOrdersByCustomer, db } from "./db.js";
    import { doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentCustomer = localStorage.getItem("currentCustomer");
    const currentUID      = localStorage.getItem("currentCustomerUID") || "";
    if (!currentCustomer) {
        alert("Please login as customer first.");
        window.location.href = "login.html";
    }

    document.getElementById("customerLabel").innerText = "Hello, " + currentCustomer + " 👋";

    let currentFilter   = "all";
    let _allOrders      = [];
    let pendingDeleteId = null;

    // ── Delete modal wiring ────────────────────────────────────────────────
    document.getElementById("delModalCancelBtn").addEventListener("click", closeDelModal);
    document.getElementById("delModalConfirmBtn").addEventListener("click", async function() {
        if (!pendingDeleteId) return;
        const btn = this;
        btn.disabled = true;
        btn.innerText = "Deleting...";
        try {
            await deleteDoc(doc(db, "orders", pendingDeleteId));
            _allOrders = _allOrders.filter(o => o.id !== pendingDeleteId);
            closeDelModal();
            showToast("🗑️ Order deleted.");
            renderOrders();
        } catch(e) {
            alert("Failed to delete: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "🗑️ Yes, Delete";
        }
    });

    function openDelModal(orderId) {
        pendingDeleteId = orderId;
        const order = _allOrders.find(o => o.id === orderId);
        const title = document.getElementById("delModalTitle");
        title.textContent = (order?.status === "cancelled")
            ? "🗑️ Delete Cancelled Order?"
            : "🗑️ Delete Rejected Order?";
        document.getElementById("delModalOverlay").classList.add("open");
    }
    function closeDelModal() {
        pendingDeleteId = null;
        document.getElementById("delModalOverlay").classList.remove("open");
    }

    // ── Load orders ────────────────────────────────────────────────────────
    async function loadOrders() {
        try {
            _allOrders = await getOrdersByCustomer(currentUID);
        } catch(e) {
            console.error("Failed to load orders:", e);
        }
        renderOrders();
    }

    // ── A single order/reservation counts as "rejected" either when its
    //    status is literally "rejected" (regular orders), OR when it's a
    //    reservation the seller rejected via the sellerRejectedReservation
    //    flag (reservations stay at status "pending" but get that flag —
    //    see approval-of-order.html's "Reject Reservation" action). ──────
    function isRejectedOrder(o) {
        return o.status === "rejected" || o.sellerRejectedReservation === true;
    }
    function isCancelledOrder(o) {
        return o.status === "cancelled";
    }

    // ── Filter: only cancelled + rejected orders/reservations ──────────────
    function getVisibleOrders() {
        let list = _allOrders.filter(o => isCancelledOrder(o) || isRejectedOrder(o));
        if (currentFilter === "cancelled") list = list.filter(isCancelledOrder);
        else if (currentFilter === "rejected") list = list.filter(isRejectedOrder);
        // Cancelled orders first, then rejected — newest first within each group
        list.sort((a, b) => {
            const groupA = isCancelledOrder(a) ? 0 : 1;
            const groupB = isCancelledOrder(b) ? 0 : 1;
            if (groupA !== groupB) return groupA - groupB;
            const ta = a.createdAt?.seconds || 0;
            const tb = b.createdAt?.seconds || 0;
            return tb - ta;
        });
        return list;
    }

    // ── Filter tab handler ──────────────────────────────────────────────────
    window.setFilter = function(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        renderOrders();
    };

    // ── Render ─────────────────────────────────────────────────────────────
    function renderOrders() {
        const orders = getVisibleOrders();
        const list   = document.getElementById("orderList");
        list.innerHTML = "";

        if (orders.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">✅</div>
                    <div>No cancelled or rejected orders!</div>
                </div>`;
            return;
        }

        orders.forEach(order => {
            const card          = document.createElement("div");
            const rejected      = isRejectedOrder(order);
            const cancelled     = isCancelledOrder(order);
            const isReservation = order.type === "reservation";

            card.classList.add("order-card");
            if (cancelled) card.classList.add("is-cancelled");
            if (rejected)  card.classList.add("is-rejected");

            const rawDate    = order.createdAt?.seconds
                ? new Date(order.createdAt.seconds * 1000)
                : order.createdAt ? new Date(order.createdAt) : null;
            const displayDate = rawDate
                ? rawDate.toLocaleDateString("en-PH", { year:"numeric", month:"short", day:"numeric" })
                : "—";

            // Status badge — a card could technically match both filters
            // (shouldn't normally happen) so prefer showing "Cancelled"
            // first.
            const statusBadge = cancelled
                ? `<span class="status-badge cancelled">🚫 Cancelled</span>`
                : `<span class="status-badge rejected">🚫 Rejected</span>`;

            // Bottom notice
            let notice;
            if (rejected) {
                notice = `
                    <div class="rejected-notice">
                        <div class="rn-icon">🚫</div>
                        <div>
                            <strong>${isReservation ? 'Reservation Rejected by Seller' : 'Order Rejected by Seller'}</strong>
                            <p>Unfortunately, the seller has rejected this ${isReservation ? 'reservation' : 'order'}. You may delete this from your records or try ordering again.</p>
                        </div>
                    </div>`;
            } else {
                notice = `
                    <div class="cancelled-notice">
                        <div class="cn-icon">🚫</div>
                        <div>
                            <strong>${isReservation ? 'Reservation Cancelled' : 'Order Cancelled'}</strong>
                            <p>This ${isReservation ? 'reservation' : 'order'} was cancelled. You may delete this from your records.</p>
                        </div>
                    </div>`;
            }

            card.innerHTML = `
                <div class="order-card-top">
                    <div class="order-meta">
                        <span class="order-type-badge ${isReservation ? 'reserve-badge' : 'order-badge'}">
                            ${isReservation ? '📅 Reservation' : '🛒 Order'}
                        </span>
                        ${statusBadge}
                    </div>
                    <span class="order-date">${displayDate}</span>
                </div>

                <div class="order-body">
                    <img class="order-img" src="${order.image || ''}" alt="${order.name || ''}">
                    <div class="order-info">
                        <h3 class="order-name">${order.name || 'Item'}</h3>
                        <p class="order-detail">Qty: <strong>${order.qty || 1}</strong></p>
                        <p class="order-detail">Price: <strong class="order-price">₱${(parseFloat(order.price || 0) * (order.qty || 1)).toFixed(0)}</strong></p>
                        <p class="order-seller">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                            ${order.sellerUsername || order.seller || '—'}
                        </p>
                        ${isReservation && (order.reserveDate || order.date) ? `<p class="order-detail">Reserve Date: <strong>${order.reserveDate || order.date}</strong></p>` : ''}
                        ${order.referenceNum ? `<p class="order-detail">Ref #: <strong>${order.referenceNum}</strong></p>` : ''}
                    </div>
                </div>

                ${notice}
                <div style="padding: 0 16px 14px; text-align: right;">
                    <button class="delete-btn" data-id="${order.id}">🗑️ Delete Order</button>
                </div>
            `;

            card.querySelector(".delete-btn").addEventListener("click", () => openDelModal(order.id));

            list.appendChild(card);
        });
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
    }

    window.goBack = function() { window.location.href = "customer-profile.html"; };

    // Initial load (no auto-refresh)
    loadOrders();
</script>
</body>
</html>
